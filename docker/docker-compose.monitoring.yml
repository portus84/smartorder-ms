name: smartorder

x-grafana-env: &x-grafana-env
  GF_SECURITY_ADMIN_USER: "${GRAFANA_SECURITY_ADMIN_USER:-admin}"
  GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_SECURITY_ADMIN_PASSWORD:-password}"
  GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_AUTH_ANONYMOUS_ENABLED:-true}"
  GF_AUTH_ANONYMOUS_ORG_NAME: "${GRAFANA_AUTH_ANONYMOUS_ORG_NAME:-Main Org.}"
  GF_AUTH_ANONYMOUS_ORG_ROLE: "${GRAFANA_AUTH_ANONYMOUS_ORG_ROLE:-Viewer}"
  GF_REDUCE_PROVISIONING_VAR_SUBST: "true"

x-influxdb-env: &x-influxdb-env
  INFLUXDB_ADMIN_USER: "${INFLUXDB_ADMIN_USER:-admin}"
  INFLUXDB_ADMIN_PASSWORD: "${INFLUXDB_ADMIN_PASSWORD:-password}"
  INFLUXDB_BUCKET: &INFLUXDB_BUCKET "${INFLUXDB_BUCKET:-jmeter}"
  INFLUXDB_ORG: &INFLUXDB_ORG "${INFLUXDB_ORG:-smartorder-org}"
  INFLUXDB_TOKEN: &INFLUXDB_TOKEN "${INFLUXDB_TOKEN:-my-super-secret-token}"

x-jmeter-env: &x-jmeter-env
  INFLUXDB_URL: &INFLUXDB_URL "${INFLUXDB_URL:-http://influxdb:8086}"
  INFLUXDB_ORG: *INFLUXDB_ORG
  INFLUXDB_BUCKET: *INFLUXDB_BUCKET
  INFLUXDB_TOKEN: *INFLUXDB_TOKEN

x-jmeter-editor-env: &x-jmeter-editor-env
  JMETER_EDITOR_AUTH: "${JMETER_EDITOR_AUTH:-none}"
  JMETER_EDITOR_PUID: "${JMETER_EDITOR_PUID:-1000}"
  JMETER_EDITOR_PGID: "${JMETER_EDITOR_PGID:-1000}"
  JMETER_EDITOR_TZ: "${JMETER_EDITOR_TZ:-Europe/Rome}"
  JMETER_EDITOR_DEFAULT_WORKSPACE: "${JMETER_EDITOR_DEFAULT_WORKSPACE:-/config/workspace}"

networks:
  smartorder-net:
    name: smartorder-net
    driver: bridge

services:
  dashy:
    image: lissy93/dashy:latest
    container_name: dashy
    ports:
      - "8080:8080"
    volumes:
      - ./config-services/dashy/conf.yml:/app/user-data/conf.yml
    networks:
      - smartorder-net
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:master
    container_name: dozzle
    ports:
      - "8180:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Instructs Dozzle to only search for containers with this specific label
      DOZZLE_FILTER: label=dozzle=true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    labels:
      dozzle: true
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus-data'
      - '--storage.tsdb.retention.time=10h' # Keep data for 10 hours (no persistence)
    ports:
      - "9090:9090"
    networks:
      - smartorder-net
    volumes:
      - ./config-services/prometheus/conf.yml:/etc/prometheus/prometheus.yml:ro
    tmpfs:
      - /prometheus
      - /prometheus-data # Use tmpfs for temporary data storage
    depends_on:
      - consul
      - mongodb-exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    labels:
      dozzle: true
    ports:
      - "3000:3000"
    networks:
      - smartorder-net
    environment:
      <<: *x-grafana-env
      INFLUXDB_URL: *INFLUXDB_URL
      INFLUXDB_ORG: *INFLUXDB_ORG
      INFLUXDB_BUCKET: *INFLUXDB_BUCKET
      INFLUXDB_TOKEN: *INFLUXDB_TOKEN
    volumes:
      - ./config-services/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config-services/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    tmpfs:
      - /var/lib/grafana # Use tmpfs for temporary data storage
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    networks:
      - smartorder-net
    environment:
      <<: *x-influxdb-env
      INFLUXD_CONFIG_PATH: /etc/influxdb2/influx-configs
      INFLUXD_BOLT_PATH: /var/lib/influxdb2/influxd.bolt
      INFLUXD_ENGINE_PATH: /var/lib/influxdb2/engine
    volumes:
      - ./config-services/influxdb/setup-influx.sh:/setup-influx.sh:ro
    entrypoint: [ "/bin/bash", "/setup-influx.sh" ]
    tmpfs:
      - /var/lib/influxdb2
      - /etc/influxdb2
      - /root/.influxdbv2
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://influxdb:8086/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  jmeter:
    build:
      context: ./config-services/jmeter
      dockerfile: Dockerfile
    container_name: jmeter
    networks:
      - smartorder-net
    volumes:
      - ./../jmeter/workspace:/jmeter
      - ./../jmeter/workspace/results:/tmp/results
    environment:
      <<: *x-jmeter-env
    depends_on:
      influxdb:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: no

  jmeter-editor:
    image: linuxserver/code-server:latest
    container_name: jmeter-editor
    ports:
      - "8443:8443"
    environment:
      <<: *x-jmeter-editor-env
    volumes:
      - ./../jmeter/workspace:/config/workspace
    networks:
      - smartorder-net

